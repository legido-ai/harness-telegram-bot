services:
  bot:
    build: .
    image: ghcr.io/legido-ai/harness-telegram-bot:latest
    container_name: harness-telegram-bot
    env_file:
      - .env
    environment:
      # opencode (default) or pi; see .env.example
      BACKEND: ${BACKEND:-opencode}
      DATA_DIR: /data
      HEALTH_HOST: 127.0.0.1
      HEALTH_PORT: "8080"
    volumes:
      - bot-data:/data
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
    name: harness-telegram-bot-data
